<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/tower-defence-game/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keepward, a tower defence game. Build on the grass. Stop the column before the gate.">
  <meta name="theme-color" content="#0C120B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keepward">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Keepward</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0C120B;
      color: #F3E6C8;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
    }
    #boot strong {
      font: 700 28px/1 Georgia, "Times New Roman", serif;
      letter-spacing: 0.08em;
    }
    #boot span {
      color: #D7A441;
      font: 600 13px/1.3 Georgia, "Times New Roman", serif;
    }
  </style>
</head>
<body>
  <div id="boot">
    <strong>Keepward</strong>
    <span>Hold the gate</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
